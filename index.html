<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Memory</title>
<style>
  :root {
    --paper:      #EDE7DA;
    --paper-deep: #E3DBCB;
    --ink:        #1C1A17;
    --ink-soft:   #55504733;
    --muted:      #8A8375;
    --signal:     #C13B2E;
    --thread:     #3A6B63;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(120% 90% at 100% 0%, #F3EEE3 0%, var(--paper) 55%, var(--paper-deep) 100%);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    padding: 0.5rem clamp(0.6rem, 1.5vw, 1.125rem) clamp(1.2rem, 3vw, 2.25rem);
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  header {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.6ch;
    margin-bottom: 1.4rem;
    font-family: var(--mono);
    font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
    /* Reserve the height of the tallest state (a pill button is taller than
       plain text) so switching to the filter view never shifts the page. */
    min-height: 1.9rem;
  }
  header .brand { color: var(--signal); }
  header .sep { color: var(--muted); }
  header .status { margin: 0; min-height: 0; }

  .status {
    font-family: var(--mono);
    font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em;
    display: inline-flex; flex-wrap: wrap; align-items: center;
    gap: 0.35rem 0.9rem;               /* row-gap when wrapped, column-gap between segments */
    text-transform: none;
  }
  /* Each segment is atomic — never breaks mid-phrase. Dot separators sit
     between segments and wrap away cleanly when a segment moves to a new row. */
  .stat-seg { white-space: nowrap; display: inline-flex; align-items: center; gap: 0.5ch; }
  .stat-seg + .stat-seg::before {
    content: "\00B7"; color: var(--ink-soft);
    margin-right: 0.4ch; margin-left: -0.4ch;
  }
  .status .clear {
    background: none; border: 1px solid var(--ink-soft); color: var(--muted);
    padding: 0.22rem 0.6rem; font-size: 0.68rem; border-radius: 20px;
  }
  .status .clear:hover { color: var(--signal); border-color: var(--signal); }

  /* save state banner */
  .savebar {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.04em;
    display: none; align-items: center; gap: 0.7ch; flex-wrap: wrap;
    margin-bottom: 1rem; padding: 0.5rem 0.8rem;
    border-radius: 5px; border: 1px solid var(--signal);
    background: #C13B2E14; color: var(--signal);
  }
  .savebar.show { display: flex; }
  .savebar button {
    background: var(--signal); color: var(--paper); border-color: var(--signal);
    font-size: 0.66rem; padding: 0.2rem 0.6rem; border-radius: 20px;
  }
  .savebar button:hover { filter: brightness(1.15); }
  .savebar .note { color: var(--ink); opacity: 0.7; }

  button {
    font-family: var(--mono); cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  button:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }

  .pill {
    font-family: var(--mono);
    font-size: 0.68rem; letter-spacing: 0.05em;
    padding: 0.24rem 0.6rem; border-radius: 20px;
    line-height: 1.5;
  }

  /* ================= GROUPS ================= */
  .group { margin-bottom: 2.1rem; }

  .group-head {
    display: grid;
    grid-template-columns: 0.75rem minmax(0, 1fr);
    gap: 0.9rem; align-items: center;
    /* Matches a question row's top padding, so the first insertion + sits
       exactly midway between the header bar and the first question's bar —
       the same spacing every other insertion point gets. */
    margin-bottom: 0.75rem;
    position: relative;
  }
  .group-bar-head {
    height: 1.5rem; border-radius: 3px;
    background: var(--gc);
    border: none; padding: 0; cursor: pointer;
    transition: filter 0.18s ease, box-shadow 0.18s ease;
  }
  .group-bar-head:hover { filter: brightness(1.12); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gc) 25%, transparent); }
  .group-bar-head.open { box-shadow: 0 0 0 3px color-mix(in srgb, var(--gc) 40%, transparent); }

  /* colour popover anchored to the bar */
  .swatches {
    position: absolute; top: 2rem; left: 0; z-index: 20;
    display: none; flex-direction: column; gap: 0.4rem;
    background: #FFFDF8; border: 1px solid var(--ink-soft);
    border-radius: 14px; padding: 0.55rem 0.65rem;
    box-shadow: 0 6px 18px #1C1A1720;
  }
  .swatches.open { display: flex; }
  .swatch-row { display: flex; gap: 0.4rem; align-items: center; }
  .swatch-btn {
    width: 1.1rem; height: 1.1rem; border-radius: 50%;
    border: 1px solid #00000022; padding: 0; cursor: pointer;
  }
  .swatch-btn:hover { transform: scale(1.12); }
  .swatch-btn.sel { box-shadow: 0 0 0 2px #FFFDF8, 0 0 0 3.5px var(--ink); }
  /* A colour another group already uses can't be picked twice. */
  .swatch-btn:disabled { opacity: 0.22; cursor: default; }
  .swatch-btn:disabled:hover { transform: none; }

  .name-wrap { display: inline-flex; align-items: center; gap: 0.7rem; min-width: 0; justify-self: start; }
  .group-name {
    font-family: var(--mono);
    font-size: 0.74rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gc); background: none; border: none; padding: 0.15rem 0;
    flex: 0 0 auto; min-width: 2rem; font-weight: 600;
  }
  .group-name:focus { outline: none; border-bottom: 1px solid var(--gc); }

  /* Delete hidden until the name area is hovered or focused; reacts only
     to that, never to hovering elsewhere in the group. */
  .group-tools { display: flex; gap: 0.4rem; align-items: center; }
  .group-kill {
    opacity: 0; transition: opacity 0.15s ease, color 0.18s ease, border-color 0.18s ease;
    pointer-events: none;
  }
  .name-wrap:hover .group-kill,
  .name-wrap:focus-within .group-kill,
  .group-kill:focus-visible { opacity: 1; pointer-events: auto; }
  .group-tools.stay .group-kill { opacity: 1; pointer-events: auto; }
  .group-kill {
    background: none; border: 1px solid var(--ink-soft); color: var(--muted);
    font-size: 0.66rem; letter-spacing: 0.05em; padding: 0.2rem 0.6rem; border-radius: 20px;
  }
  .group-kill:hover { color: var(--signal); border-color: var(--signal); }
  .confirm-del {
    display: flex; gap: 0.35rem; align-items: center;
    font-family: var(--mono); font-size: 0.66rem; color: var(--signal);
  }
  .confirm-del button { font-size: 0.64rem; padding: 0.2rem 0.6rem; border-radius: 20px; }
  .confirm-del .yes { background: var(--signal); color: var(--paper); border-color: var(--signal); }
  .confirm-del .no  { background: none; color: var(--muted); border-color: var(--ink-soft); }
  .confirm-del .no:hover { color: var(--ink); }

  /* ---- rows ---- */
  ol.questions { list-style: none; margin: 0; padding: 0; }
  .q {
    position: relative;
    display: grid;
    grid-template-columns: 0.75rem minmax(0, 1fr) auto;
    gap: 0.5rem 0.9rem; align-items: start;
    padding: 0.75rem 0 0.75rem 0;
    transition: background 0.25s ease, opacity 0.25s ease;
    border-radius: 4px;
  }
  /* Separator is a straight line drawn above each row (except the first),
     as a pseudo-element so it never picks up the row's corner radius. */
  /* Separators are drawn by the insertion rows that sit between questions. */

  .bar {
    align-self: stretch; min-height: 1.5rem;
    border-radius: 3px; background: var(--gc);
    border: none; padding: 0; cursor: pointer;
    transition: opacity 0.15s ease, filter 0.18s ease, box-shadow 0.18s ease;
    position: relative;
  }
  /* Same colour and hover as the group's header bar. */
  .bar:hover { filter: brightness(1.12); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gc) 25%, transparent); }
  .bar:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }
  /* Hovering an unasked bar shows a small × — the "mark asked" affordance. */
  .bar::after {
    content: "\00D7"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #FFFDF8; font-size: 0.8rem; font-weight: 700; line-height: 1;
    opacity: 0; transition: opacity 0.12s ease;
  }
  .bar:hover::after, .bar:focus-visible::after { opacity: 0.9; }

  /* Asked rows only appear when "show asked" is on — dimmed and struck.
     The greying and strikethrough already signal "done", so no check mark. */
  /* Dim the row's content, not the row itself. */
  .q.asked > .bar,
  .q.asked > .q-body { opacity: 0.5; }
  .q.asked .text:not(.text-edit) { text-decoration: line-through; text-decoration-color: var(--muted); }
  .q.asked > .bar { opacity: 0.4; }

  /* On an asked row the × means "un-ask / bring back", shown on hover. */

  .group-count {
    font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em;
    color: var(--muted); text-transform: none; white-space: nowrap;
    align-self: center;
  }
  .asked-tag { color: var(--muted); }
  .asked-wrap { display: inline-flex; align-items: center; gap: 0.5rem; }
  #uncheckAllBtn.armed, #resetBtn.armed { color: var(--signal); border-color: var(--signal); }
  .import-btn:disabled { opacity: 0.4; cursor: default; }
  .import-btn:disabled:hover { color: var(--muted); border-color: var(--ink-soft); }
  .q-body { min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .q .text { font-size: 1.06rem; line-height: 1.4; padding-top: 0.05rem; cursor: text; }

  /* Follow-up notes captured during the interview, hanging under the question. */
  .notes { list-style: none; margin: 0; padding: 0 0 0 0.9rem; display: flex; flex-direction: column; gap: 0.2rem; }
  .notes .note {
    position: relative; cursor: pointer; user-select: none;
    font-family: var(--mono); font-size: 0.76rem; line-height: 1.45;
    color: var(--ink); padding-left: 0.9rem;
    transition: color 0.18s ease, opacity 0.18s ease;
  }
  .notes .note::before {
    content: ""; position: absolute; left: 0; top: 0.5em;
    width: 0.35rem; height: 0.35rem; border-radius: 50%;
    background: var(--gc); opacity: 0.7;
  }
  .notes .note:hover { color: var(--thread); }
  .notes .note.done { text-decoration: line-through; text-decoration-color: var(--ink-soft); color: var(--muted); opacity: 0.65; }
  .notes .note.done::before { background: var(--ink-soft); }
  .q .text:hover { text-decoration: underline; text-decoration-color: var(--ink-soft); text-underline-offset: 3px; }
  .q .text-edit {
    font-family: inherit; font-size: 1.06rem; line-height: 1.4;
    color: var(--ink); background: #FFFDF8;
    border: 1px solid var(--thread); border-radius: 5px;
    padding: 0.2rem 0.5rem; width: 100%; resize: none; overflow: hidden;
  }
  .q .text-edit:hover { text-decoration: none; }
  .q .text-edit:focus { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--thread) 25%, transparent); }


  /* Third column: just the delete control. Delete, and the Delete/Cancel
     pair that replaces it, share one fixed width so the column never moves. */
  .q-actions { display: flex; flex-direction: column; gap: 0.35rem; padding-top: 0.1rem; }
  .q-kill, .confirm-q button {
    width: 5.2rem; height: 1.65rem; justify-content: center;
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.05em;
    border-radius: 20px; padding: 0; white-space: nowrap; cursor: pointer;
  }
  .q-kill {
    background: none; border: 1px solid var(--ink-soft); color: var(--muted);
    text-transform: none;
  }
  .q-kill:hover { color: var(--signal); border-color: var(--signal); }
  /* Delete only appears while the row is hovered, so the list stays quiet.
     It keeps its space while hidden, so hovering never shifts the text. */
  .q-actions .q-kill { opacity: 0; pointer-events: none; transition: opacity 0.15s ease, color 0.18s ease, border-color 0.18s ease; }
  .q:hover .q-actions .q-kill,
  .q-actions .q-kill:focus-visible { opacity: 1; pointer-events: auto; }
  .q.asked:hover .q-actions .q-kill { opacity: 0.5; }

  /* Confirm stacks Delete over Cancel inside the same column. */
  .confirm-q { display: flex; flex-direction: column; gap: 0.35rem; }
  .confirm-q .yes { background: var(--signal); color: var(--paper); border-color: var(--signal); }
  .confirm-q .no  { background: none; color: var(--muted); border-color: var(--ink-soft); }
  .confirm-q .no:hover { color: var(--ink); }


  /* Drag-to-reorder feedback */  body.dragging { cursor: grabbing; user-select: none; }
  body.dragging .bar { cursor: grabbing; }
  .q.drag-active {
    background: color-mix(in srgb, var(--gc, #3A6B63) 12%, transparent);
    box-shadow: 0 4px 14px #1C1A1720; border-radius: 4px;
    position: relative; z-index: 5;
  }
  .q.drag-active .bar { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gc) 45%, transparent); }
  /* While armed, the bar signals it's grabbable. */
  .bar { touch-action: none; }

  /* ---- insertion points ---- */
  /* An insertion point sits on each separator between questions. Closed, it's
     just the hairline with a + that fades in on hover; open, it expands into
     the input row. The tail one appends to the group. */
  .insert-row {
    list-style: none; position: relative;
    display: flex; align-items: center; gap: 0.9rem;
    height: 0.9rem; margin: 0;
  }
  /* The separator itself. On hover it retracts to leave a small gap where
     the + sits, so the glyph reads as breaking the line rather than
     sitting on a patch of background. */
  .insert-row::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px solid var(--ink-soft);
    transition: left 0.15s ease;
  }
  .insert-row:hover::before,
  .insert-row:focus-within::before { left: 1.1rem; }
  .insert-row.no-rule::before { border-top-color: transparent; }
  /* The + hides until the separator is hovered, keeping the list quiet.
     Its horizontal bar sits on the separator's own line. */
  .insert-row .plus-btn {
    opacity: 0; z-index: 2;
    transition: opacity 0.15s ease;
  }
  .insert-row:hover .plus-btn,
  .insert-row .plus-btn:focus-visible,
  .insert-row.open .plus-btn { opacity: 1; }
  /* Open: fixed height so expanding never shifts what's below by a stray pixel. */
  .insert-row.open { height: 2.6rem; }
  .insert-row.open::before { border-top-color: transparent; }
  .insert-row.open .q-input { flex: 1 1 auto; }
  /* An empty group's row is permanently open — the + would have nothing to
     toggle, so it holds its space without showing or taking clicks. */
  .plus-btn.spacer { visibility: hidden; pointer-events: none; }

  .plus-btn {
    width: 0.75rem; height: 0.9rem; padding: 0; flex: 0 0 auto;
    background: none; border: none; cursor: pointer;
    position: relative; border-radius: 3px;
    overflow: visible;
  }
  /* Invisible padded hit area — the glyph stays small, the tap target
     stays finger-sized on touch devices. */
  .plus-btn::before, .plus-btn::after { pointer-events: none; }
  /* The + is drawn from two equal bars, centred — its size is set here,
     not by the button box, so the column width can't distort it. */
  .plus-btn::before, .plus-btn::after {
    content: ""; position: absolute; background: var(--gc);
    border-radius: 1px;
    top: 50%; left: 50%;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .plus-btn::before {                 /* horizontal bar */
    width: 0.62rem; height: 2px;
    transform: translate(-50%, -50%);
  }
  .plus-btn::after {                  /* vertical bar, same length */
    width: 2px; height: 0.62rem;
    transform: translate(-50%, -50%);
  }
  .plus-btn:hover::before, .plus-btn:hover::after { opacity: 0.65; }
  .plus-btn.open::after { transform: translate(-50%, -50%) rotate(90deg); opacity: 0; }
  .plus-btn:focus-visible { outline: 2px solid var(--thread); outline-offset: 3px; }

  .q-input {
    background: #FFFDF8; border: 1px dashed var(--ink-soft); color: var(--ink);
    min-width: 0;
  }
  .q-input::placeholder { color: var(--muted); }
  .q-input:focus { outline: none; border-style: solid; border-color: var(--gc); }
  .add-btn {
    background: var(--gc); color: #FFFDF8; border-color: var(--gc);
    white-space: nowrap; flex: 0 0 auto;
  }
  .add-btn:hover { filter: brightness(0.88); }

  /* ---- new group bar ---- */
  /* A [hidden] element with an explicit display rule stays visible —
     display wins over the attribute. Make hidden authoritative. */
  [hidden] { display: none !important; }

  /* Plain row — no column grid needed here. */
  .newgroup {
    display: flex; align-items: center; gap: 0.6rem;
    flex-wrap: wrap; margin-top: 0.8rem;
  }
  #newGroupName {
    background: #FFFDF8; border: 1px dashed var(--ink-soft); color: var(--ink);
    flex: 1 1 14rem; min-width: 0;
  }
  #newGroupName::placeholder { color: var(--muted); }
  #newGroupName:focus { outline: none; border-style: solid; border-color: var(--thread); }
  #addGroup {
    background: var(--ink); color: var(--paper); border-color: var(--ink); white-space: nowrap;
  }
  #addGroup:hover { background: var(--thread); border-color: var(--thread); }

  .empty-group {
    font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    padding: 0.6rem 0 0.2rem 1.4rem; letter-spacing: 0.04em;
  }

  /* ---- export ---- */
  /* The three collapsible sections read as one stacked block: generous
     space above the first, tight dividers between, clear run-out below. */
  .export { border-top: 1px solid var(--ink-soft); padding-top: 0.9rem; margin-top: 0.9rem; }
  .export:first-of-type { margin-top: 2.6rem; }
  .export:last-of-type { margin-bottom: clamp(1.4rem, 4vw, 2.6rem); }
  .disclosure {
    display: flex; align-items: center; gap: 0.55rem;
    background: none; border: none; padding: 0.15rem 0;
    cursor: pointer; width: 100%; text-align: left;
  }
  .disclosure .export-title { transition: color 0.18s ease; }
  .disclosure:hover .export-title { color: var(--thread); }
  .chev {
    width: 0.5rem; height: 0.5rem; flex: 0 0 auto;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(-45deg);          /* points right when closed */
    transition: transform 0.2s ease, border-color 0.18s ease;
    margin-left: 0.15rem;
  }
  .disclosure[aria-expanded="true"] .chev {
    transform: rotate(45deg);           /* points down when open */
  }
  .disclosure:hover .chev { border-color: var(--thread); }
  .disclosure:focus-visible { outline: 2px solid var(--thread); outline-offset: 3px; border-radius: 4px; }

  .import-hint {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.04em;
    color: var(--muted);
  }

  .export-title {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
  }
  #exportOut {
    width: 100%; margin-top: 0.8rem;
    font-family: var(--mono); font-size: 0.78rem; line-height: 1.65;
    color: var(--ink); background: #FFFDF8;
    border: 1px solid var(--ink-soft); border-radius: 6px;
    padding: 0.9rem 1rem; resize: vertical; min-height: 9rem;
    white-space: pre; overflow-x: auto;
  }
  #exportOut:focus { outline: 2px solid var(--thread); outline-offset: 1px; }

  .export-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8rem; flex-wrap: wrap;
  }
  .session-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8rem 1.2rem; flex-wrap: wrap;
    padding: 0.55rem 0;
  }
  .session-row + .session-row { border-top: 1px solid var(--ink-soft); }
  .session-row .import-hint { flex: 1 1 16rem; }
  .session-row .import-btn { flex: 0 0 auto; white-space: nowrap; }
  /* Cancel button injected beside an armed confirm — muted, secondary. */
  .session-cancel {
    flex: 0 0 auto; white-space: nowrap;
    background: none; border: 1px solid var(--ink-soft); color: var(--muted);
  }
  .session-cancel:hover { color: var(--ink); border-color: var(--muted); }
  /* Set the destructive reset apart from the routine session actions. */
  .session-danger { margin-top: 0.6rem; border-top: 1px solid var(--ink-soft); }
  .session-row + .session-danger { border-top: 1px solid var(--ink-soft); }
  .import-btn {
    background: none; border: 1px solid var(--ink-soft); color: var(--muted);
  }
  .import-btn:hover { color: var(--thread); border-color: var(--thread); }
  #importIn {
    width: 100%; margin-top: 0.8rem;
    font-family: var(--mono); font-size: 0.78rem; line-height: 1.65;
    color: var(--ink); background: #FFFDF8;
    border: 1px dashed var(--ink-soft); border-radius: 6px;
    padding: 0.9rem 1rem; resize: vertical; min-height: 7rem; rows: 6;
  }
  #importIn:focus { outline: none; border-style: solid; border-color: var(--thread); }
  #importIn::placeholder { color: var(--muted); }
  .import-note {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.04em;
    margin-top: 0.5rem; min-height: 1.2rem; color: var(--muted);
  }
  /* When the uncheck action is armed, its row hint turns into the warning
     in place — no separate element appears, so the layout never shifts. */
  .import-hint.hint-warn { color: var(--signal); }
  .import-note.err { color: var(--signal); }
  .import-note.ok  { color: var(--thread); }

  /* Narrow layout. This is about available width only — hover-dependent
     behaviour is handled separately below, so a narrow desktop window keeps
     its hover affordances. */
  @media (max-width: 640px) {
    /* Add row wraps on narrow screens: input takes the line, button below. */
    .insert-row { flex-wrap: wrap; }
    .insert-row.open { height: auto; padding: 0.4rem 0; }
    .insert-row.open .q-input { flex: 1 1 100%; }
    /* Name and delete share one line; header is two columns now. */
    .group-head { gap: 0.55rem; }
    .group-tools { flex-wrap: wrap; justify-content: flex-end; }
    .confirm-del { flex-wrap: wrap; justify-content: flex-end; }
  }

  /* Touch devices have no hover, so anything that normally reveals on hover
     stays visible. Keyed to the pointer, not the window width — a narrow
     desktop window still gets the quiet hover-based behaviour. */
  @media (hover: none) {
    .q-actions .q-kill { opacity: 1; pointer-events: auto; }
    .q.asked .q-actions .q-kill { opacity: 0.5; }
    .insert-row .plus-btn { opacity: 1; }
    .insert-row::before { left: 1.1rem; }
    .group-kill { opacity: 1; pointer-events: auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">My First Memory</span>
    <span class="sep">·</span>
    <span class="status" id="status"></span>
  </header>

  <div class="savebar" id="savebar"></div>

  <div id="groups"></div>

  <section class="export">
    <button class="disclosure" id="groupToggle" aria-expanded="false" aria-controls="groupBody">

    <div class="fold newgroup" id="groupBody" hidden>
      <input type="text" id="newGroupName" class="pill" placeholder="Add a group" aria-label="New group name">
      <button class="pill" id="addGroup">Add group</button>
    </div>
  </section>

  <section class="export">
    <button class="disclosure" id="exportToggle" aria-expanded="false" aria-controls="exportBody">
      <span class="chev" aria-hidden="true"></span>
      <span class="export-title">Export</span>
    </button>
    <div class="fold" id="exportBody" hidden>
      <textarea id="exportOut" readonly spellcheck="false" aria-label="Exported list"></textarea>
    </div>
  </section>

  <section class="export">
    <button class="disclosure" id="importToggle" aria-expanded="false" aria-controls="importBody">
      <span class="chev" aria-hidden="true"></span>
      <span class="export-title">Import</span>
    </button>
    <div class="fold" id="importBody" hidden>
      <div class="export-head">
        <span class="import-hint">Paste a previously exported list, then replace.</span>
        <button class="pill import-btn" id="importBtn">Replace list with this</button>
      </div>
      <textarea id="importIn" spellcheck="false" placeholder="Paste a previously exported list here.&#10;&#10;Group name&#10;- A question (label, label)&#10;- Another question&#10;&#10;Next group&#10;- More questions" aria-label="Paste list to import"></textarea>
      <div class="import-note" id="importNote"></div>
    </div>
  </section>

  <section class="export">
    <button class="disclosure" id="resetToggle" aria-expanded="false" aria-controls="resetBody">
      <span class="chev" aria-hidden="true"></span>
      <span class="export-title">Session</span>
    </button>
    <div class="fold" id="resetBody" hidden>
      <div class="session-row">
        <span class="import-hint" id="askedHint">Show questions you've already marked as asked.</span>
        <button class="pill import-btn" id="showAskedBtn">Show asked</button>
      </div>
      <div class="session-row">
        <span class="import-hint" id="uncheckHint">Clear every asked mark and start the list fresh — keeps your questions.</span>
        <button class="pill import-btn" id="uncheckAllBtn">Uncheck all</button>
      </div>
      <div class="session-row session-danger">
        <span class="import-hint" id="resetHint">Discard everything and reload the built-in starter questions.</span>
        <button class="pill import-btn" id="resetBtn">Reset to defaults</button>
      </div>
    </div>
  </section>

</div>

<script>
const KEY = "mfm:groups";

/* Each hue has a dark and a light variant. The picker lays these out in
   two rows: darks on top, lights beneath, so the pairs line up.
   Change or extend freely — the UI reads the array lengths. */
const PALETTE_DARK = [
  "#C13B2E", "#B9762A", "#8A7B2F",
  "#3A6B63", "#3C5C86", "#6B4A78", "#7A6A5C"
];
const PALETTE_LIGHT = [
  "#EF5F51", "#F0A045", "#C9AE33",
  "#4FAE9C", "#5A8FD0", "#A468BA", "#B0947C"
];
const PALETTE = [...PALETTE_DARK, ...PALETTE_LIGHT];

let groups = [];
let openPicker = null;     // group id whose colour popover is open
let openAdder = null;      // { gid, before } — which insertion point is open
let showAsked = false;     // reveal already-asked questions in the live view
let pendingDelete = null;  // group id awaiting delete confirmation
let pendingDeleteQ = null; // question id awaiting delete confirmation
let saveState = "ok";      // "ok" | "saving" | "failed"
let lastError = null;

const groupsEl   = document.getElementById("groups");
const statusEl   = document.getElementById("status");
const exportEl   = document.getElementById("exportOut");
const newGroupEl = document.getElementById("newGroupName");
const savebarEl  = document.getElementById("savebar");

const uid = () => Math.random().toString(36).slice(2, 10);
const allQuestions = () => groups.flatMap(g => g.questions);

/* ---------- persistence ----------------------------------------------
   Two possible environments:

   (a) Standalone — this file opened from disk or a static host.
       localStorage works. Synchronous, local to this browser, no
       network, no server. This is the intended way to run it.

   (b) Sandboxed — rendered inside the Claude artifact viewer, where
       localStorage is blocked and window.storage (a bridge to a remote
       service) is the only option. Useful for previewing; the remote
       service can and does fail.

   The adapter below picks whichever is available, preferring (a).
   Everything above this line is storage-agnostic.
--------------------------------------------------------------------- */

const Store = (() => {
  // Feature-detect localStorage properly: it can exist but throw on access.
  function localAvailable() {
    try {
      const probe = "__probe__" + Math.random();
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      return true;
    } catch (e) {
      return false;
    }
  }

  if (localAvailable()) {
    return {
      mode: "local",
      label: "saved in this browser",
      async get(k) {
        const v = window.localStorage.getItem(k);
        return v === null ? null : { key: k, value: v };
      },
      async set(k, v) {
        window.localStorage.setItem(k, v);
        return { key: k, value: v };
      }
    };
  }

  if (typeof window.storage === "object" && window.storage) {
    return {
      mode: "remote",
      label: "preview mode — saving to Claude storage",
      async get(k) { return await window.storage.get(k); },
      async set(k, v) {
        const res = await window.storage.set(k, v);
        if (!res || typeof res !== "object") throw new Error("Unexpected response type");
        return res;
      }
    };
  }

  // Nothing available — run in memory only, and say so.
  return {
    mode: "none",
    label: "not saving — memory only",
    async get() { return null; },
    async set() { throw new Error("No storage available in this context"); }
  };
})();

let saveSeq = 0;   // guards against out-of-order saves

async function load() {
  try {
    const res = await Store.get(KEY);
    if (res && typeof res.value === "string") groups = JSON.parse(res.value);
  } catch (e) {
    groups = [];
  }
  if (!Array.isArray(groups) || !groups.length) seed();
  // Older saves predate the asked flag and follow-up notes — normalise both.
  groups.forEach(g => g.questions.forEach(q => {
    q.asked = !!q.asked;
    delete q.labels;              // labels were removed from the app
    q.notes = Array.isArray(q.notes)
      ? q.notes.filter(n => n && n.text).map(n => ({ id: n.id || uid(), text: n.text, done: !!n.done }))
      : [];
  }));
  uniqueColours();
  render();
}

async function verifyWrite(payload) {
  try {
    const back = await Store.get(KEY);
    return !!(back && back.value === payload);
  } catch (e) {
    return false;
  }
}

async function save() {
  const seq = ++saveSeq;
  const payload = JSON.stringify(groups);

  // Local writes are synchronous and reliable — no retry theatre needed.
  if (Store.mode === "local") {
    try {
      await Store.set(KEY, payload);
      saveState = "ok"; lastError = null;
    } catch (e) {
      // Realistically only quota exhaustion reaches here.
      saveState = "failed";
      lastError = e && e.message ? e.message : String(e);
    }
    renderSavebar();
    return;
  }

  if (Store.mode === "none") {
    saveState = "failed";
    lastError = "No storage in this context";
    renderSavebar();
    return;
  }

  // Remote (sandbox preview): flaky, so retry and verify.
  saveState = "saving";
  renderSavebar();

  for (let attempt = 1; attempt <= 3; attempt++) {
    if (seq !== saveSeq) return;
    try {
      await Store.set(KEY, payload);
      if (seq !== saveSeq) return;
      saveState = "ok"; lastError = null;
      renderSavebar();
      return;
    } catch (e) {
      lastError = e && e.message ? e.message : String(e);
      if (await verifyWrite(payload)) {
        if (seq !== saveSeq) return;
        saveState = "ok"; lastError = null;
        renderSavebar();
        return;
      }
      if (attempt < 3) await new Promise(r => setTimeout(r, attempt * 400));
    }
  }

  if (seq !== saveSeq) return;
  saveState = "failed";
  renderSavebar();
}

function seed() {
  groups = [
    { id: uid(), name: "Vergangenheit", color: PALETTE_LIGHT[0], questions: [
      { id: uid(), text: "Was ist deine erste Erinnerung?" },
      { id: uid(), text: "Wenn du an zu Hause zurück denkst, welches Bild siehst du da in deinem Kopf?" },
      { id: uid(), text: "Weißt du, wie sich deine Eltern kennengelernt haben?" },
      { id: uid(), text: "Wie hast du die Feiertage als Kind verbracht?" },
      { id: uid(), text: "Was glaubst du, haben deine Eltern richtig gemacht?" },
      { id: uid(), text: "Welche Spiele hast du als Kind gespielt?" },
      { id: uid(), text: "Womit haben sich deine Freunde beschäftigt?" },
      { id: uid(), text: "Wer war dein bester Freund?" },
      { id: uid(), text: "Welcher Sommer war der schönste für dich?" },
      { id: uid(), text: "Erinnerst du dich an ein gebrochenes Herz?" }
    ]},
    { id: uid(), name: "Gegenwart", color: PALETTE_LIGHT[3], questions: [
      { id: uid(), text: "Was verstehen die Leute an dir oft falsch?" },
      { id: uid(), text: "Gibt es etwas aus der Vergangenheit, das dich immer noch beschäftigt?" },
      { id: uid(), text: "Gibt es einen guten Freund, den du im Laufe der Zeit verloren hast?" },
      { id: uid(), text: "Erinnerst du dich an einen Lieblingsort, den es nicht mehr gibt?" },
      { id: uid(), text: "Gibt es jemanden, von dem du dir wünschen würdest, angerufen zu werden?" },
      { id: uid(), text: "Mit wem sprichst du, wenn du vor einem extrem schwierigen Problem stehst?" },
      { id: uid(), text: "Was bringt dich zum Lächeln?" }
    ]},
    { id: uid(), name: "Zukunft", color: PALETTE_LIGHT[4], questions: [
      { id: uid(), text: "Was ist etwas Verrücktes, dass du nie im Leben tun würdest?" },
      { id: uid(), text: "Was ist das Schlimmste, dass dir jemals passieren könnte?" },
      { id: uid(), text: "Was brauchen junge Menschen, um in dieser Welt zu bestehen?" },
      { id: uid(), text: "Was tust du an deinem letzten Tag auf dieser Erde?" },
      { id: uid(), text: "Wie möchtest du, dass man sich an dich erinnert?" }
    ]}
  ];
}

function renderSavebar() {
  savebarEl.innerHTML = "";
  savebarEl.classList.toggle("show", saveState === "failed");
  if (saveState !== "failed") return;

  const msg = document.createElement("span");
  msg.textContent = "Not saved" + (lastError ? " \u2014 " + lastError : "") + ".";

  const retry = document.createElement("button");
  retry.textContent = "Retry";
  retry.addEventListener("click", e => { e.stopPropagation(); save(); });

  const note = document.createElement("span");
  note.className = "note";
  note.textContent = "Your work is intact on screen. Copy the export box below before closing this tab.";

  savebarEl.append(msg, retry, note);

  // The advice above is useless if Export is collapsed — open it.
  const eBtn = document.getElementById("exportToggle");
  const eBody = document.getElementById("exportBody");
  if (eBtn && eBody && eBtn.getAttribute("aria-expanded") !== "true") {
    eBtn.setAttribute("aria-expanded", "true");
    eBody.hidden = false;
  }
}

/* ---------- group colours ----------
   No two groups ever share a colour. Going down the list, a group whose
   colour is already taken first gets the darker shade of its own hue. If
   that is taken too, it gets the next free dark colour, then the next free
   light one. With more groups than colours, a repeat is unavoidable. */
function uniqueColours() {
  const used = new Set();
  groups.forEach(g => {
    if (!used.has(g.color)) { used.add(g.color); return; }
    let hue = PALETTE_LIGHT.indexOf(g.color);
    if (hue === -1) hue = PALETTE_DARK.indexOf(g.color);
    const candidates = (hue !== -1 ? [PALETTE_DARK[hue]] : [])
      .concat(PALETTE_DARK, PALETTE_LIGHT);
    const free = candidates.find(c => !used.has(c));
    if (free) g.color = free;
    used.add(g.color);
  });
}

/* ---------- group actions ---------- */
function addGroup() {
  const name = newGroupEl.value.trim();
  if (!name) { newGroupEl.focus(); return; }
  const color = PALETTE_DARK[groups.length % PALETTE_DARK.length];
  const g = { id: uid(), name, color, questions: [] };
  groups.push(g);
  uniqueColours();
  newGroupEl.value = "";
  save(); render();
  // The new group's input is already open — put the cursor straight in it.
  const fresh = document.querySelector('[data-addfor="' + g.id + '|end"]');
  if (fresh) fresh.focus();
}

function removeGroup(gid) {
  groups = groups.filter(g => g.id !== gid);
  pendingDelete = null;
  openPicker = null;
  save(); render();
}

function renameGroup(gid, name) {
  const g = groups.find(g => g.id === gid);
  if (g) { g.name = name.trim() || g.name; save(); render(); }
}

function setColor(gid, color) {
  const g = groups.find(g => g.id === gid);
  if (g) { g.color = color; openPicker = null; save(); render(); }
}

/* ---------- question actions ---------- */
function addQuestion(gid, text, beforeQid) {
  const t = text.trim();
  if (!t) return false;
  const g = groups.find(g => g.id === gid);
  if (!g) return false;
  const q = { id: uid(), text: t, notes: [] };
  // beforeQid places the new question directly above that one; without it
  // (or if it's gone) the question lands at the end of the group.
  const idx = beforeQid ? g.questions.findIndex(x => x.id === beforeQid) : -1;
  if (idx === -1) g.questions.push(q); else g.questions.splice(idx, 0, q);
  save(); render();
  return true;
}

/* ---------- question + notes text format ----------
   A question is edited as one block of text:
     line 1        the question itself
     lines 2..n    "- " bullets, each a follow-up note
   A checked-off note carries an "[x] " marker so its state survives editing. */

function questionToText(q) {
  const lines = [q.text];
  (q.notes || []).forEach(n => lines.push("- " + (n.done ? "[x] " : "") + n.text));
  return lines.join("\n");
}

function parseQuestionText(raw) {
  const lines = String(raw).split("\n");
  const text = (lines.shift() || "").trim();
  const notes = [];
  lines.forEach(line => {
    let s = line.trim();
    if (!s) return;
    s = s.replace(/^[-*+]\s*/, "");          // strip the bullet marker
    let done = false;
    const box = s.match(/^\[([ xX])\]\s*/);  // optional done marker
    if (box) { done = box[1].toLowerCase() === "x"; s = s.slice(box[0].length); }
    s = s.trim();
    if (s) notes.push({ id: uid(), text: s, done });
  });
  return { text, notes };
}

function editQuestion(gid, qid, raw) {
  const g = groups.find(g => g.id === gid);
  const q = g && g.questions.find(q => q.id === qid);
  if (!q) return;
  const { text, notes } = parseQuestionText(raw);
  if (!text) return;                          // never blank out a question
  q.text = text;
  q.notes = notes;
  save();
}

/* Toggle a single follow-up note struck through / not. */
function toggleNote(gid, qid, nid) {
  const g = groups.find(g => g.id === gid);
  const q = g && g.questions.find(q => q.id === qid);
  const n = q && (q.notes || []).find(n => n.id === nid);
  if (n) { n.done = !n.done; save(); render(); }
}

function removeQuestion(gid, qid) {
  const g = groups.find(g => g.id === gid);
  if (g) g.questions = g.questions.filter(q => q.id !== qid);
  pendingDeleteQ = null;
  save(); render();
}


function toggleAsked(gid, qid) {
  const g = groups.find(g => g.id === gid);
  const q = g && g.questions.find(q => q.id === qid);
  if (q) q.asked = !q.asked;
  save(); render();
}

/* Live drag-reorder, within a group and across groups. Started after a
   long-press on the bar. The dragged row moves together with the separator
   above it, so the list keeps its insert/question rhythm while dragging.
   Near the top or bottom of the window the page scrolls, so a question can
   travel to a group further down. The new order is committed on release. */
function startDrag(li, gid, qid, startY) {
  if (!li.parentElement) return;

  document.body.classList.add("dragging");
  li.classList.add("drag-active");

  // The separator directly above the dragged row travels with it.
  let sep = li.previousElementSibling;
  if (!sep || !sep.classList.contains("insert-row")) sep = null;

  const lists = () => [...document.querySelectorAll("ol.questions")];
  const rowsIn = ol => [...ol.querySelectorAll(":scope > .q")].filter(r => r !== li);

  // Keep exactly one rule-less separator at the top of each list.
  const fixRules = () => lists().forEach(ol => {
    const first = ol.querySelector(":scope > .insert-row");
    ol.querySelectorAll(":scope > .insert-row").forEach(r => {
      if (r.classList.contains("open")) return;
      r.classList.toggle("no-rule", r === first);
    });
  });

  // Pick the list under the pointer: the group section whose box holds y,
  // or the nearest one when the pointer sits in the gap between groups.
  const listAt = y => {
    let best = null, bestDist = Infinity;
    for (const ol of lists()) {
      const box = (ol.closest(".group") || ol).getBoundingClientRect();
      const dist = y < box.top ? box.top - y : y > box.bottom ? y - box.bottom : 0;
      if (dist < bestDist) { bestDist = dist; best = ol; }
    }
    return best;
  };

  let lastY = startY;
  let pointerY = startY;
  let movingDown = false;

  const place = () => {
    const y = pointerY;
    const ol = listAt(y);
    if (!ol) return;

    // Trigger the move ~15% into a neighbour from the side it's approached,
    // rather than at its midpoint, so reordering feels responsive.
    const edge = 0.15;
    let before = null;
    for (const r of rowsIn(ol)) {
      const box = r.getBoundingClientRect();
      const threshold = movingDown
        ? box.top + box.height * edge
        : box.bottom - box.height * edge;
      if (y < threshold) { before = r; break; }
    }

    // Insert before the target's own separator, or before the list's tail.
    let anchor;
    if (before) {
      anchor = before.previousElementSibling;
      if (!anchor || !anchor.classList.contains("insert-row")) anchor = before;
    } else {
      const items = ol.querySelectorAll(":scope > .insert-row");
      anchor = items[items.length - 1] || null;
    }
    if (anchor === sep || anchor === li) return;
    if (sep && sep.nextElementSibling === li && li.nextElementSibling === anchor) return;

    if (sep) ol.insertBefore(sep, anchor);
    ol.insertBefore(li, anchor);
    // The row takes on the colour of the group it now sits in.
    const sec = ol.closest(".group");
    if (sec) li.style.setProperty("--gc", sec.style.getPropertyValue("--gc"));
    fixRules();
  };

  // Edge auto-scroll while dragging.
  const EDGE = 70, MAX_STEP = 18;
  let raf = null;
  const tick = () => {
    const h = window.innerHeight;
    let step = 0;
    if (pointerY < EDGE) step = -Math.ceil(MAX_STEP * (EDGE - pointerY) / EDGE);
    else if (pointerY > h - EDGE) step = Math.ceil(MAX_STEP * (pointerY - (h - EDGE)) / EDGE);
    if (step) {
      movingDown = step > 0;
      window.scrollBy(0, step);
      place();
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);

  const onMove = e => {
    pointerY = e.clientY;
    if (pointerY !== lastY) movingDown = pointerY > lastY;
    lastY = pointerY;
    place();
  };

  const onUp = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    cancelAnimationFrame(raf);
    document.body.classList.remove("dragging");
    li.classList.remove("drag-active");

    const ol = li.parentElement;
    const toGid = ol && ol.dataset.gid;
    const from = groups.find(x => x.id === gid);
    const to = groups.find(x => x.id === toGid);
    const moved = from && from.questions.find(q => q.id === qid);
    if (moved && to) {
      // Only the visible rows are in the DOM (asked ones may be hidden), so
      // place the question relative to its visible neighbours in the target
      // group, leaving hidden questions where they were.
      const order = [...ol.querySelectorAll(":scope > .q")].map(r => r.dataset.qid);
      const pos = order.indexOf(qid);
      const nextId = order[pos + 1] || null;
      const prevId = order[pos - 1] || null;

      from.questions = from.questions.filter(q => q.id !== qid);
      const list = to.questions;
      if (nextId && list.some(q => q.id === nextId)) {
        list.splice(list.findIndex(q => q.id === nextId), 0, moved);
      } else if (prevId && list.some(q => q.id === prevId)) {
        list.splice(list.findIndex(q => q.id === prevId) + 1, 0, moved);
      } else {
        list.push(moved);
      }
      save();
    }
    render();
  };

  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
}

/* ---------- render ---------- */
function render() {
  groupsEl.innerHTML = "";
  groups.forEach(g => { const sec = renderGroup(g); if (sec) groupsEl.appendChild(sec); });
  renderStatus();
  renderExport();
  renderSavebar();
  if (typeof syncSessionButtons === "function") syncSessionButtons();
}

function renderGroup(g) {
  const sec = document.createElement("section");
  sec.className = "group";
  sec.style.setProperty("--gc", g.color);

  const head = document.createElement("div");
  head.className = "group-head";

  /* colour bar doubles as the colour picker trigger */
  const bar = document.createElement("button");
  bar.className = "group-bar-head" + (openPicker === g.id ? " open" : "");
  bar.title = "Change group colour";
  bar.setAttribute("aria-label", "Change colour for " + g.name);
  bar.setAttribute("aria-expanded", openPicker === g.id ? "true" : "false");
  bar.addEventListener("click", e => {
    e.stopPropagation();
    openPicker = (openPicker === g.id) ? null : g.id;
    render();
  });

  const pop = document.createElement("div");
  pop.className = "swatches" + (openPicker === g.id ? " open" : "");
  pop.addEventListener("click", e => e.stopPropagation());

  const makeRow = colors => {
    const row = document.createElement("div");
    row.className = "swatch-row";
    colors.forEach(c => {
      const dot = document.createElement("button");
      dot.className = "swatch-btn" + (c === g.color ? " sel" : "");
      dot.style.background = c;
      const owner = groups.find(o => o.id !== g.id && o.color === c);
      dot.title = owner ? "Used by \u201C" + owner.name + "\u201D" : c;
      if (owner) dot.disabled = true;
      dot.setAttribute("aria-label", "Set colour " + c);
      dot.addEventListener("click", () => setColor(g.id, c));
      row.appendChild(dot);
    });
    return row;
  };

  pop.append(makeRow(PALETTE_DARK), makeRow(PALETTE_LIGHT));

  const nameWrap = document.createElement("div");
  nameWrap.className = "name-wrap";
  const name = document.createElement("input");
  name.type = "text";
  name.className = "group-name";
  name.value = g.name;
  name.setAttribute("aria-label", "Group name");
  /* Width tracks the text so the delete button sits right beside the name,
     with even spacing — and updates live while editing. */
  const sizeName = () => {
    const chars = Math.max(name.value.length, 2);
    // glyph advance (~1ch each) + 0.2em tracking per character
    name.style.width = "calc(" + chars + "ch + " + (chars * 0.2).toFixed(1) + "em)";
  };
  sizeName();
  name.addEventListener("input", sizeName);
  name.addEventListener("change", () => renameGroup(g.id, name.value));
  name.addEventListener("keydown", e => { if (e.key === "Enter") name.blur(); });
  nameWrap.appendChild(name);

  const askedN = g.questions.filter(q => q.asked).length;
  if (askedN) {
    const cnt = document.createElement("span");
    cnt.className = "group-count";
    cnt.textContent = askedN + "/" + g.questions.length + " asked";
    nameWrap.appendChild(cnt);
  }

  /* delete, with inline confirmation (native confirm is blocked here);
     lives next to the name and only shows on hover over the name area. */
  const tools = document.createElement("div");
  tools.className = "group-tools";

  if (pendingDelete === g.id) {
    const box = document.createElement("div");
    box.className = "confirm-del";
    box.addEventListener("click", e => e.stopPropagation());
    const q = g.questions.length;
    const txt = document.createElement("span");
    txt.textContent = q ? "Delete group and " + q + " question" + (q === 1 ? "" : "s") + "?" : "Delete this group?";
    const yes = document.createElement("button");
    yes.className = "yes"; yes.textContent = "Delete";
    yes.addEventListener("click", () => removeGroup(g.id));
    const no = document.createElement("button");
    no.className = "no"; no.textContent = "Cancel";
    no.addEventListener("click", () => { pendingDelete = null; render(); });
    box.append(txt, yes, no);
    tools.appendChild(box);
    tools.classList.add("stay");
  } else {
    const gkill = document.createElement("button");
    gkill.className = "group-kill";
    gkill.textContent = "delete";
    gkill.addEventListener("click", e => {
      e.stopPropagation();
      pendingDelete = g.id; openPicker = null; render();
    });
    tools.appendChild(gkill);
  }
  nameWrap.appendChild(tools);

  head.append(bar, nameWrap, pop);
  sec.appendChild(head);

  const ol = document.createElement("ol");
  ol.className = "questions";
  ol.dataset.gid = g.id;

  // What's visible now: everything, or only unasked while asked are hidden.
  const visible = showAsked ? g.questions : g.questions.filter(q => !q.asked);
  const askedCount = g.questions.filter(q => q.asked).length;

  // An empty group has nothing to show and only one useful next step, so its
  // input opens straight away rather than hiding behind a hover target.
  const isEmpty = !g.questions.length;

  if (!isEmpty && !visible.length) {
    const none = document.createElement("div");
    none.className = "empty-group";
    none.textContent = "all " + g.questions.length + " asked \u2014 nothing left here";
    sec.appendChild(none);
  }

  // An insertion point sits on every separator between questions, so a new
  // question can be added exactly where it belongs instead of at the end
  // and then dragged. The last one appends to the group.
  visible.forEach((q, i) => {
    ol.appendChild(renderInsertRow(g, q.id, i === 0));
    ol.appendChild(renderQuestion(g, q));
  });
  // The last insertion point appends to the group — same row, same behaviour.
  // For an empty group it starts open, so the prompt is there immediately.
  ol.appendChild(renderInsertRow(g, null, isEmpty, isEmpty));
  sec.appendChild(ol);

  return sec;
}

/* One insertion point. `before` is the question it inserts above, or null to
   append at the end of the group. `alwaysOpen` keeps an empty group's input
   showing without needing a hover or a click. */
function renderInsertRow(g, before, noRule, alwaysOpen) {
  const open = alwaysOpen ||
    (openAdder && openAdder.gid === g.id && openAdder.before === before);
  const key = g.id + "|" + (before || "end");

  const row = document.createElement("li");
  row.className = "insert-row" + (open ? " open" : "") + (noRule ? " no-rule" : "");

  const plus = document.createElement("button");
  plus.className = "plus-btn" + (open ? " open" : "") + (alwaysOpen ? " spacer" : "");
  plus.title = open ? "Close" : "Add a question here";
  plus.setAttribute("aria-label", open ? "Close add-question field" : "Add a question here in " + g.name);
  plus.setAttribute("aria-expanded", open ? "true" : "false");
  if (alwaysOpen) {
    // Nothing to toggle in an empty group — keep the space, drop the control.
    plus.disabled = true;
    plus.setAttribute("aria-hidden", "true");
    plus.removeAttribute("aria-expanded");
  }

  const toggleAdder = e => {
    e.stopPropagation();
    openAdder = open ? null : { gid: g.id, before: before };
    render();
    if (!open) {
      const fresh = document.querySelector('[data-addfor="' + key + '"]');
      if (fresh) fresh.focus();
    }
  };
  plus.addEventListener("click", toggleAdder);
  row.appendChild(plus);

  if (open) {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "pill q-input";
    input.placeholder = before ? "Insert a question here" : "Add a question to \u201C" + g.name + "\u201D";
    input.setAttribute("aria-label", "New question in " + g.name);
    input.dataset.addfor = key;

    const btn = document.createElement("button");
    btn.className = "pill add-btn";
    btn.textContent = "Add question";

    const commit = () => {
      const text = input.value;
      if (text.trim()) {
        openAdder = null;                    // collapse back to the + after adding
        addQuestion(g.id, text, before);     // this re-renders in the closed state
      }
    };
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      if (e.key === "Escape") { e.stopPropagation(); openAdder = null; render(); }
    });
    btn.addEventListener("click", e => { e.stopPropagation(); commit(); });

    row.append(input, btn);
  }

  return row;
}

function renderQuestion(g, q) {
  const li = document.createElement("li");
  li.className = "q" + (q.asked ? " asked" : "");
  li.dataset.qid = q.id;
  li.dataset.gid = g.id;

  /* The colour bar has two roles:
       - click: mark the question asked / bring it back
       - long-press (~450ms) then move: drag to reorder within the group
     A drag suppresses the click so the two never fire together. */
  const bar = document.createElement("button");
  bar.className = "bar";
  bar.title = q.asked ? "Bring back (mark not asked)" : "Mark asked · hold to drag";
  bar.setAttribute("aria-label", bar.title);
  bar.setAttribute("aria-pressed", q.asked ? "true" : "false");

  let pressTimer = null;
  let dragged = false;

  bar.addEventListener("pointerdown", e => {
    if (e.button && e.button !== 0) return;   // left/primary only
    e.stopPropagation();
    dragged = false;
    const startY = e.clientY;
    // Arm the drag after a brief hold.
    pressTimer = setTimeout(() => {
      pressTimer = null;
      startDrag(li, g.id, q.id, startY);
      dragged = true;
    }, 180);

    const cancelIfMoved = ev => {
      if (Math.abs(ev.clientY - startY) > 6 && pressTimer) {
        clearTimeout(pressTimer); pressTimer = null;
      }
    };
    const cleanup = () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      window.removeEventListener("pointermove", cancelIfMoved);
      window.removeEventListener("pointerup", cleanup);
    };
    window.addEventListener("pointermove", cancelIfMoved);
    window.addEventListener("pointerup", cleanup, { once: true });
  });

  bar.addEventListener("click", e => {
    e.stopPropagation();
    if (dragged) { dragged = false; return; }   // was a drag, not a click
    toggleAsked(g.id, q.id);
  });

  /* Column 2 holds the question and, beneath it, any follow-up notes. */
  const body = document.createElement("div");
  body.className = "q-body";

  const text = document.createElement("span");
  text.className = "text";
  text.textContent = q.text;
  text.title = "Click to edit \u00B7 Shift+Enter adds a note";
  text.addEventListener("click", e => {
    e.stopPropagation();
    // Edit the question and its notes as one block of text.
    const ta = document.createElement("textarea");
    ta.className = "text text-edit";
    ta.value = questionToText(q);
    ta.rows = 1;
    body.replaceWith(ta);
    const autosize = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    autosize();
    ta.addEventListener("input", autosize);

    let committed = false;
    const commit = () => {
      if (committed) return;
      committed = true;
      editQuestion(g.id, q.id, ta.value);
      render();
    };
    ta.addEventListener("keydown", ev => {
      // Shift+Enter opens a new bullet line — the "- " is inserted for you,
      // so during an interview you just type the note and keep going.
      if (ev.key === "Enter" && ev.shiftKey) {
        ev.preventDefault();
        const at = ta.selectionStart;
        const insert = "\n- ";
        ta.value = ta.value.slice(0, at) + insert + ta.value.slice(ta.selectionEnd);
        const caret = at + insert.length;
        ta.setSelectionRange(caret, caret);
        autosize();
        return;
      }
      // Plain Enter saves the question together with its notes.
      if (ev.key === "Enter") { ev.preventDefault(); commit(); }
      if (ev.key === "Escape") { ev.stopPropagation(); committed = true; render(); }
    });
    ta.addEventListener("blur", commit);
  });

  body.appendChild(text);

  if ((q.notes || []).length) {
    const ul = document.createElement("ul");
    ul.className = "notes";
    q.notes.forEach(n => {
      const li = document.createElement("li");
      li.className = "note" + (n.done ? " done" : "");
      li.textContent = n.text;
      li.title = n.done ? "Mark as still open" : "Strike off";
      li.addEventListener("click", e => { e.stopPropagation(); toggleNote(g.id, q.id, n.id); });
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  const actions = document.createElement("div");
  actions.className = "q-actions";

  if (pendingDeleteQ === q.id) {
    const box = document.createElement("span");
    box.className = "confirm-q";
    box.addEventListener("click", e => e.stopPropagation());

    const yes = document.createElement("button");
    yes.className = "yes";
    yes.textContent = "Delete";
    yes.addEventListener("click", e => { e.stopPropagation(); removeQuestion(g.id, q.id); });

    const no = document.createElement("button");
    no.className = "no";
    no.textContent = "Cancel";
    no.addEventListener("click", e => { e.stopPropagation(); pendingDeleteQ = null; render(); });

    box.append(yes, no);
    actions.appendChild(box);
  } else {
    const kill = document.createElement("button");
    kill.className = "pill q-kill";
    kill.textContent = "delete";
    kill.title = "Delete question";
    kill.setAttribute("aria-label", "Delete question");
    kill.addEventListener("click", e => {
      e.stopPropagation();
      pendingDeleteQ = q.id; pendingDelete = null; openPicker = null; render();
    });
    actions.appendChild(kill);
  }

  li.append(bar, body, actions);
  return li;
}

function renderStatus() {
  statusEl.innerHTML = "";
  const qs = allQuestions();
  const askedTotal = qs.filter(q => q.asked).length;

  const parts = [
    groups.length + " groups",
    qs.length + " questions",
    Store.label
  ];
  parts.forEach(t => {
    const seg = document.createElement("span");
    seg.className = "stat-seg";
    seg.textContent = t;
    statusEl.appendChild(seg);
  });

  // Asked count — the show/uncheck actions now live in the Session section.
  if (askedTotal) {
    const wrap = document.createElement("span");
    wrap.className = "asked-wrap stat-seg";
    const askedTag = document.createElement("span");
    askedTag.className = "asked-tag";
    askedTag.textContent = askedTotal + " asked";
    wrap.append(askedTag);
    statusEl.append(wrap);
  }
}


/* ---------- export ---------- */
function buildExport() {
  return groups.map(g => {
    const lines = g.questions.map(q => {
      const mark = q.asked ? "[x] " : "";
      let out = "- " + mark + q.text;
      // Notes ride along as indented sub-bullets so a round trip keeps them.
      (q.notes || []).forEach(n => {
        out += "\n  - " + (n.done ? "[x] " : "") + n.text;
      });
      return out;
    });
    return g.name + "\n" + (lines.length ? lines.join("\n") : "- (no questions yet)");
  }).join("\n\n");
}

function renderExport() {
  const text = buildExport();
  exportEl.value = text;
  exportEl.rows = Math.min(Math.max(text.split("\n").length + 1, 6), 24);
}

/* ---------- import ----------
   Reverses buildExport(): a bare line starts a group, a "- " line is a
   question. Older files carry labels as a trailing (a, b) on a question
   line. Those are stripped and dropped, since the app no longer has labels. */
function parseImport(text) {
  const out = [];
  let current = null;

  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;

    // An indented bullet is a follow-up note on the question above it.
    const indented = /^\s+[-*+]\s+/.test(raw);
    if (indented && current && current.questions.length) {
      let nb = line.replace(/^[-*+]\s+/, "").trim();
      let ndone = false;
      const nbox = nb.match(/^\[([ xX]?)\]\s*(.*)$/);
      if (nbox) { ndone = nbox[1].toLowerCase() === "x"; nb = nbox[2].trim(); }
      if (nb) {
        const host = current.questions[current.questions.length - 1];
        (host.notes = host.notes || []).push({ id: uid(), text: nb, done: ndone });
      }
      return;
    }

    if (/^[-*]\s+/.test(line)) {
      let body = line.replace(/^[-*]\s+/, "").trim();
      if (/^\(no questions yet\)$/i.test(body)) return;

      // Optional [x] / [ ] checkbox prefix marks asked state.
      let asked = false;
      const cb = body.match(/^\[([ xX]?)\]\s*(.*)$/);
      if (cb) { asked = cb[1].toLowerCase() === "x"; body = cb[2].trim(); }

      const m = body.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
      if (m) body = m[1].trim();
      if (!body) return;

      if (!current) {
        current = { id: uid(), name: "Ungrouped", color: PALETTE[0], questions: [] };
        out.push(current);
      }
      current.questions.push({ id: uid(), text: body, asked, notes: [] });
    } else {
      current = {
        id: uid(),
        name: line,
        color: PALETTE_DARK[out.length % PALETTE_DARK.length],
        questions: []
      };
      out.push(current);
    }
  });

  return out;
}

const importIn   = document.getElementById("importIn");
const importNote = document.getElementById("importNote");

document.getElementById("importBtn").addEventListener("click", () => {
  const text = importIn.value;
  if (!text.trim()) {
    importNote.className = "import-note err";
    importNote.textContent = "Nothing to import — paste a list first.";
    return;
  }

  let parsed;
  try {
    parsed = parseImport(text);
  } catch (e) {
    importNote.className = "import-note err";
    importNote.textContent = "Could not read that. Check the format.";
    return;
  }

  const count = parsed.reduce((n, g) => n + g.questions.length, 0);
  if (!parsed.length || !count) {
    importNote.className = "import-note err";
    importNote.textContent = "No questions found. Question lines need to start with \u201C- \u201D.";
    return;
  }

  // Keep current colours on import: match by name first, else by position.
  // With duplicate names, the second "Gegenwart" matches the second existing
  // "Gegenwart", and so on. Renaming a group or changing question text never
  // reshuffles the palette — the colour belongs to the slot.
  const seenName = {};
  parsed.forEach((g, i) => {
    const key = g.name.toLowerCase();
    const nth = seenName[key] || 0;
    seenName[key] = nth + 1;
    const sameName = groups.filter(old => old.name.toLowerCase() === key);
    if (sameName[nth]) g.color = sameName[nth].color;
    // An extra group with a known name starts from that name's colour and
    // is then moved to its darker shade by uniqueColours().
    else if (sameName.length) g.color = sameName[0].color;
    else if (groups[i]) g.color = groups[i].color;
  });

  groups = parsed;
  uniqueColours();
  importIn.value = "";
  importNote.className = "import-note ok";
  importNote.textContent = "Imported " + parsed.length + " group"
    + (parsed.length === 1 ? "" : "s") + " and " + count + " question"
    + (count === 1 ? "" : "s") + ".";
  save(); render();
});

/* ---------- collapsible export / import ---------- */
function wireDisclosure(btnId, bodyId, onOpen) {
  const btn = document.getElementById(btnId);
  const body = document.getElementById(bodyId);
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", open ? "false" : "true");
    body.hidden = open;
    if (!open && typeof onOpen === "function") onOpen();
  });
}
wireDisclosure("exportToggle", "exportBody");
wireDisclosure("importToggle", "importBody");
wireDisclosure("groupToggle", "groupBody", () => newGroupEl.focus());
wireDisclosure("resetToggle", "resetBody");

/* ---------- session: show asked / uncheck all ---------- */
const showAskedBtn = document.getElementById("showAskedBtn");
const uncheckAllBtn = document.getElementById("uncheckAllBtn");
const askedHint = document.getElementById("askedHint");
const uncheckHint = document.getElementById("uncheckHint");
const UNCHECK_HINT_DEFAULT = uncheckHint.textContent;   // restore after arming
let uncheckAllArmed = false;
let resetArmed = false;

// A cancel button injected next to whichever confirm is armed.
function makeCancel(onCancel) {
  const c = document.createElement("button");
  c.className = "pill session-cancel";
  c.textContent = "Cancel";
  c.addEventListener("click", e => { e.stopPropagation(); onCancel(); });
  return c;
}

function disarmSession() {
  let changed = false;
  if (uncheckAllArmed) { uncheckAllArmed = false; changed = true; }
  if (resetArmed) {
    resetArmed = false;
    resetBtn.textContent = "Reset to defaults";
    resetBtn.classList.remove("armed");
    resetHint.textContent = RESET_HINT_DEFAULT;
    resetHint.classList.remove("hint-warn");
    changed = true;
  }
  if (changed) {
    uncheckHint.textContent = UNCHECK_HINT_DEFAULT;
    uncheckHint.classList.remove("hint-warn");
    document.querySelectorAll(".session-cancel").forEach(c => c.remove());
    syncSessionButtons();
  }
  return changed;
}

function syncSessionButtons() {
  const askedTotal = allQuestions().filter(q => q.asked).length;
  showAskedBtn.textContent = showAsked ? "Hide asked" : "Show asked";
  showAskedBtn.setAttribute("aria-pressed", showAsked ? "true" : "false");
  // Disable the asked-related controls when nothing is asked yet.
  const none = askedTotal === 0;
  showAskedBtn.disabled = none;
  uncheckAllBtn.disabled = none;
  askedHint.textContent = none
    ? "No questions marked as asked yet."
    : "Show the " + askedTotal + " question" + (askedTotal === 1 ? "" : "s") + " you've marked as asked.";
  if (none && uncheckAllArmed) { uncheckAllArmed = false; }
  uncheckAllBtn.textContent = uncheckAllArmed ? "Tap again to confirm" : "Uncheck all";
  uncheckAllBtn.classList.toggle("armed", uncheckAllArmed);
}

showAskedBtn.addEventListener("click", e => {
  e.stopPropagation();
  showAsked = !showAsked;
  render();
});

uncheckAllBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (allQuestions().every(q => !q.asked)) return;
  if (!uncheckAllArmed) {
    disarmSession();              // cancel any other armed action first
    uncheckAllArmed = true;
    // Swap the row's own hint to the warning — in place, so nothing shifts.
    uncheckHint.textContent = "Clears every asked mark. Your questions stay — tap again to confirm.";
    uncheckHint.classList.add("hint-warn");
    syncSessionButtons();
    if (!uncheckAllBtn.nextElementSibling || !uncheckAllBtn.nextElementSibling.classList.contains("session-cancel")) {
      uncheckAllBtn.after(makeCancel(disarmSession));
    }
    return;
  }
  uncheckAllArmed = false;
  uncheckHint.textContent = UNCHECK_HINT_DEFAULT;
  uncheckHint.classList.remove("hint-warn");
  document.querySelectorAll(".session-cancel").forEach(c => c.remove());
  allQuestions().forEach(q => { q.asked = false; });
  showAsked = false;
  save(); render();
});

/* ---------- reset to defaults ---------- */
const resetBtn = document.getElementById("resetBtn");
const resetHint = document.getElementById("resetHint");
const RESET_HINT_DEFAULT = resetHint.textContent;   // restore after arming

resetBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (!resetArmed) {
    disarmSession();              // cancel any other armed action first
    resetArmed = true;
    resetBtn.textContent = "Tap again to confirm";
    resetBtn.classList.add("armed");
    resetHint.textContent = "Discards all current groups and questions — tap again to confirm.";
    resetHint.classList.add("hint-warn");
    if (!resetBtn.nextElementSibling || !resetBtn.nextElementSibling.classList.contains("session-cancel")) {
      resetBtn.after(makeCancel(disarmSession));
    }
    return;
  }
  resetArmed = false;
  resetBtn.classList.remove("armed");
  resetBtn.textContent = "Reset to defaults";
  resetHint.textContent = RESET_HINT_DEFAULT;
  resetHint.classList.remove("hint-warn");
  document.querySelectorAll(".session-cancel").forEach(c => c.remove());
  seed();
  save(); render();
});

/* ---------- wiring ---------- */
document.getElementById("addGroup").addEventListener("click", addGroup);
newGroupEl.addEventListener("keydown", e => { if (e.key === "Enter") addGroup(); });

/* Click outside closes the colour popover / cancels a pending delete.
   Checks the target rather than trusting stopPropagation everywhere —
   safer across mouse and touch. */
document.addEventListener("click", e => {
  const sessionArmed = uncheckAllArmed || resetArmed;
  if (openPicker === null && pendingDelete === null && pendingDeleteQ === null && !sessionArmed) return;
  const inside = e.target.closest(".swatches, .group-bar-head, .confirm-del, .group-kill, .confirm-q, .q-kill, .session-cancel, #uncheckAllBtn, #resetBtn");
  if (inside) return;
  openPicker = null; pendingDelete = null; pendingDeleteQ = null;
  if (sessionArmed) disarmSession();
  render();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Escape peels back one state at a time, most transient first:
  // 1) armed session confirms, 2) open popups / delete confirms,
  // 3) shown asked.
  if (disarmSession()) return;
  if (openPicker !== null || pendingDelete !== null || pendingDeleteQ !== null) {
    openPicker = null; pendingDelete = null; pendingDeleteQ = null; render();
    return;
  }
  if (showAsked) {
    showAsked = false; render();
  }
});

/* Warn before losing unsaved work if the backend is failing. */
window.addEventListener("beforeunload", e => {
  if (saveState === "failed") { e.preventDefault(); e.returnValue = ""; }
});

load();
</script>
